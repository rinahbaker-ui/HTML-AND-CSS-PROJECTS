<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f4;
        }

        h1 {
            text-shadow: 2px 2px 5px gray;
        }

        /* Styling ordered list */
        ol {
            background-color: #ffe0b2;
            padding: 20px;
            display: inline-block;
            text-align: left;
            border-radius: 10px;
        }

        /* Styling unordered list */
        ul {
            background-color: #c8e6c9;
            padding: 20px;
            display: inline-block;
            text-align: left;
            border-radius: 10px;
        }

        li {
            margin: 5px 0;
        }
    </style>
</head>

<body>

    <h1>&#9733; My Favorite Things &#9733;</h1>

    <!-- Ordered List -->
    <h2>Top 3 Goals</h2>
    <ol>
        <li>Learn HTML</li>
        <li>Build Projects</li>
        <li>Get Better Every Day</li>
    </ol>

    <!-- Unordered List -->
    <h2>Hobbies</h2>
    <ul>
        <li>Gaming</li>
        <li>Reading</li>
        <li>Coding</li>
    </ul>

</body>
</html>
