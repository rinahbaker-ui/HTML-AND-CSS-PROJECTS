<!DOCTYPE html>
<html lang="en">
<head>
    <title>Accessible Page</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="one_page_website.css">
</head>

<body>

    <header>
        <h1>My Heading</h1>

        <nav aria-label="Main navigation">
            <a href="#main-content">Main Content</a>
            <a href="#contact-form">Contact Form</a>
        </nav>
    </header>

    <main id="main-content">
        <p>My paragraph.</p>

        <img src="Images/pexels-willianjusten-15829427.jpg" alt="Scenic landscape with mountains and water">

        <section id="contact-form">
            <h2>Contact Form</h2>

            <form>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </form>
        </section>
    </main>

</body>
</html>
